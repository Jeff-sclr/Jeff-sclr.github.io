    <meta charset="UTF-8">

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>

        <a href="testimonials.html">Testimonials</a>

    </nav>

    <main>
        <h1>Let's Connect</h1>
        <p>I typically reply to all messages within 24 hours.</p>

        <section id="contact-methods">
            <a href="https://wa.me/254700000000" class="button" target="_blank">Chat on WhatsApp</a>
            
            <p>Email: <strong>yourname@email.com</strong></p>
        </section>

        <section id="contact-form">
            <h2>Send a Message</h2>
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <input type="text" name="name" placeholder="Your Name" required><br>
                <input type="email" name="email" placeholder="Your Email" required><br>
                <select name="service">
                    <option value="writing">Writing</option>
                    <option value="tutoring">Tutoring</option>
                    <option value="ai">AI Services</option>
                    <option value="dev">Development</option>
                </select><br>
                <textarea name="message" placeholder="Your Message"></textarea><br>
                <button type="submit">Send Message</button>
            </form>
        </section>

        <section id="social-links">
            <h3>Find me online</h3>
            <a href="#">LinkedIn</a> | <a href="#">GitHub</a> | <a href="#">Twitter/X</a>
        </section>
    </main>
